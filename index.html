<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">KPI 플래너</title>
<meta name="description" content="연간 KPI 목표, 일정 달력, 일간·주간·월간 할 일을 한 곳에서 관리하는 무료 웹 플래너입니다. 설치도 로그인도 필요 없습니다." data-i18n-attr="content:app.metaDesc" id="meta-description">
<meta property="og:title" content="KPI 플래너" data-i18n-attr="content:app.title" id="og-title">
<meta property="og:description" content="연간 KPI 목표, 일정 달력, 일간·주간·월간 할 일을 한 곳에서 관리하는 무료 웹 플래너입니다." data-i18n-attr="content:app.metaDesc" id="og-description">
<meta property="og:type" content="website">
<link rel="canonical" href="https://dailykpiplanner.com/">
<meta name="naver-site-verification" content="9123c195897dcdd788de1166a038c407a5c374d0" />
<!-- 구글 서치 콘솔 소유확인 메타 태그가 필요하면 여기에 추가하세요.
     예) <meta name="google-site-verification" content="발급받은 코드"> -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header-top">
      <div class="brand">
        <h1 data-i18n="app.title">KPI 플래너</h1>
        <p class="brand-sub" data-i18n="app.subtitle">연간 목표 · 일정 · 실행 계획 관리</p>
      </div>
      <div class="header-actions">
        <select id="lang-select" aria-label="Language" data-i18n-attr="aria-label:lang.aria">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
        <button class="btn quiet" id="btn-help">
          <svg class="ic" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.3a1.85 1.85 0 0 1 3.6.5c0 1.2-1.8 1.4-1.8 2.6"/><path d="M8 11.8h.01"/></svg>
          <span data-i18n="btn.help">사용 안내</span>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="kpi" data-i18n="tab.kpi">연간 KPI</button>
      <button class="tab-btn" data-tab="calendar"><span data-i18n="tab.calendar">달력</span><span class="tab-badge hidden" id="calendar-tab-badge"></span></button>
      <button class="tab-btn" data-tab="daily" data-i18n="tab.daily">일간</button>
      <button class="tab-btn" data-tab="weekly" data-i18n="tab.weekly">주간</button>
      <button class="tab-btn" data-tab="monthly" data-i18n="tab.monthly">월간</button>
    </nav>
  </header>

  <main>
    <!-- KPI TAB -->
    <section id="tab-kpi" class="tab-panel active">
      <div class="panel-head">
        <div class="summary" id="kpi-summary"></div>
        <button class="btn primary" id="btn-add-kpi" data-i18n="btn.addKpi">+ 새 KPI</button>
      </div>
      <div class="kpi-grid" id="kpi-list"></div>
    </section>

    <!-- CALENDAR TAB -->
    <section id="tab-calendar" class="tab-panel">
      <div id="alarm-banner"></div>
      <div class="planner-nav">
        <button class="btn icon" data-nav="calendar:-1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.2 5.2 8 10 12.8"/></svg></button>
        <div class="planner-title" id="calendar-title"></div>
        <button class="btn icon" data-nav="calendar:1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.2 10.8 8 6 12.8"/></svg></button>
        <button class="btn ghost" data-nav="calendar:0" data-i18n="nav.thisMonth">이번 달</button>
      </div>
      <div class="panel-head">
        <div class="summary" id="calendar-summary"></div>
        <button class="btn primary" id="btn-add-event" data-i18n="btn.addEvent">+ 일정 추가</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <!-- DAILY TAB -->
    <section id="tab-daily" class="tab-panel">
      <div class="planner-nav">
        <button class="btn icon" data-nav="daily:-1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.2 5.2 8 10 12.8"/></svg></button>
        <div class="planner-title" id="daily-title"></div>
        <button class="btn icon" data-nav="daily:1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.2 10.8 8 6 12.8"/></svg></button>
        <button class="btn ghost" data-nav="daily:0" data-i18n="nav.today">오늘</button>
      </div>
      <div class="panel-head">
        <div class="summary" id="daily-summary"></div>
        <button class="btn primary" data-add="daily" data-i18n="btn.addTask">+ 할 일 추가</button>
      </div>
      <ul class="task-list" id="daily-list"></ul>

      <div class="section-divider"></div>
      <div class="panel-head">
        <h2 class="section-title" data-i18n="section.undated">날짜 미정 · 장기 준비 업무</h2>
      </div>
      <div class="undated-list" id="undated-events-list"></div>
    </section>

    <!-- WEEKLY TAB -->
    <section id="tab-weekly" class="tab-panel">
      <div class="planner-nav">
        <button class="btn icon" data-nav="weekly:-1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.2 5.2 8 10 12.8"/></svg></button>
        <div class="planner-title" id="weekly-title"></div>
        <button class="btn icon" data-nav="weekly:1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.2 10.8 8 6 12.8"/></svg></button>
        <button class="btn ghost" data-nav="weekly:0" data-i18n="nav.thisWeek">이번 주</button>
      </div>
      <div class="panel-head">
        <div class="summary" id="weekly-summary"></div>
        <div class="panel-head-actions">
          <button class="btn" id="btn-weekly-summary-toggle" data-i18n="sum.show">업무 요약 보기</button>
          <button class="btn primary" data-add="weekly" data-i18n="btn.addTask">+ 할 일 추가</button>
        </div>
      </div>
      <div class="weekly-summary-panel hidden" id="weekly-summary-panel"></div>
      <ul class="task-list" id="weekly-list"></ul>
    </section>

    <!-- MONTHLY TAB -->
    <section id="tab-monthly" class="tab-panel">
      <div class="planner-nav">
        <button class="btn icon" data-nav="monthly:-1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.2 5.2 8 10 12.8"/></svg></button>
        <div class="planner-title" id="monthly-title"></div>
        <button class="btn icon" data-nav="monthly:1"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.2 10.8 8 6 12.8"/></svg></button>
        <button class="btn ghost" data-nav="monthly:0" data-i18n="nav.thisMonth">이번 달</button>
      </div>
      <div class="panel-head">
        <div class="summary" id="monthly-summary"></div>
        <button class="btn primary" data-add="monthly" data-i18n="btn.addTask">+ 할 일 추가</button>
      </div>
      <ul class="task-list" id="monthly-list"></ul>
    </section>
  </main>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="confirm-overlay hidden" id="confirm-overlay">
  <div class="confirm-box" id="confirm-box"></div>
</div>

<script src="app.js"></script>
</body>
</html>
